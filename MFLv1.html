<!doctype html>
<html lang="ja">
<head>
  <link rel="icon" type="image/png" href="MFL.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My File Library</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#dfe4ec;--accent:#4f46e5;--accent2:#eef2ff;--danger:#dc2626;--shadow:0 8px 28px #17203312}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}
header{background:linear-gradient(135deg,#111827,#312e81);color:white;padding:22px 28px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:24px}.sub{opacity:.75;font-size:13px;margin-top:4px}.headBtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:10px;background:#fff;color:#111827;font-weight:700}.btn.primary{background:#6366f1;color:#fff}.btn.dark{background:#ffffff18;color:#fff;border:1px solid #ffffff30}
main{max-width:1400px;margin:auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.search{flex:1;min-width:220px}
.drop{border:2px dashed #a5b4fc;background:#eef2ff;border-radius:16px;padding:25px;text-align:center;margin-bottom:18px;transition:.2s}.drop.drag{background:#e0e7ff;transform:scale(1.01)}.drop strong{display:block;font-size:17px}.drop small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}.thumb{height:150px;background:#f0f2f6;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:48px}.thumb img{width:100%;height:100%;object-fit:cover}.cardbody{padding:14px}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin:6px 0}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{background:var(--accent2);color:#4338ca;border-radius:99px;padding:3px 8px;font-size:11px}.desc{font-size:13px;color:#4b5563;margin-top:9px;min-height:18px;white-space:pre-wrap}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;padding:8px;border-radius:8px;background:#eef0f5}.actions .open{background:#4f46e5;color:white}.actions .del{color:#b91c1c;background:#fee2e2}
.empty{text-align:center;color:var(--muted);padding:55px 10px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.dialog{background:#fff;border-radius:17px;max-width:700px;width:100%;max-height:90vh;overflow:auto;padding:20px}.dialog h2{margin-top:0}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:700}.form input,.form textarea,.form select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.form textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalBtns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.preview{position:fixed;inset:0;background:#111;z-index:30;display:none;flex-direction:column}.preview.show{display:flex}.previewbar{height:58px;background:#1f2937;color:white;display:flex;align-items:center;padding:0 12px;gap:10px}.previewbar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview iframe,.preview img,.preview embed{border:0;flex:1;width:100%;height:calc(100vh - 58px);object-fit:contain;background:#fff}.notice{font-size:12px;color:var(--muted);margin:8px 0}.linkIcon{font-size:11px;background:#dcfce7;color:#166534;padding:3px 7px;border-radius:99px}
@media(max-width:700px){main{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.headBtns{width:100%}.btn{flex:1}}
</style>
</head>
<body>
<div class="app">
<header>
 <div><h1>📚 My File Library</h1><div class="sub">PDF・画像・各種ファイル・Webリンクをまとめて管理</div></div>
 <div class="headBtns">
  <button class="btn primary" id="addFileBtn">＋ ファイル追加</button>
  <button class="btn dark" id="addLinkBtn">🔗 リンク追加</button>
  <button class="btn dark" id="exportBtn">JSON書き出し</button>
  <button class="btn dark" id="importBtn">JSON読み込み</button>
  <button class="btn dark" id="backupBtn">📦 完全バックアップ</button>
  <input type="file" id="fileInput" multiple hidden>
  <input type="file" id="jsonInput" accept=".json,application/json" hidden>
  <input type="file" id="backupInput" accept=".json,application/json" hidden>
 </div>
</header>
<main>
 <div class="stats">
  <div class="stat"><b id="count">0</b><span>登録数</span></div>
  <div class="stat"><b id="fileCount">0</b><span>ファイル</span></div>
  <div class="stat"><b id="linkCount">0</b><span>リンク</span></div>
  <div class="stat"><b id="size">0 B</b><span>ファイル容量</span></div>
 </div>
 <div class="toolbar">
  <input class="search" id="search" placeholder="🔎 ファイル名・タイトル・説明・タグを検索">
  <select id="typeFilter"><option value="">すべての種類</option><option value="file">ファイル</option><option value="link">リンク</option></select>
  <select id="catFilter"><option value="">すべてのカテゴリ</option></select>
  <select id="sort"><option value="new">新しい順</option><option value="old">古い順</option><option value="name">名前順</option><option value="size">容量順</option></select>
 </div>
 <div class="drop" id="drop">
  <strong>📥 ここにファイルをドラッグ＆ドロップ</strong>
  <small>複数ファイル対応。登録後もブラウザ内に保存されます。</small>
 </div>
 <div id="grid" class="grid"></div>
 <div id="empty" class="empty" style="display:none">登録されている資料はありません。<br>「ファイル追加」または「リンク追加」から登録できます。</div>
</main>
</div>

<div class="modal" id="modal">
 <div class="dialog">
  <h2 id="modalTitle">ファイルを追加</h2>
  <div class="form">
   <div id="sourceInfo" class="notice"></div>
   <label>タイトル<input id="fTitle" placeholder="表示するタイトル"></label>
   <div class="row">
    <label>カテゴリ<input id="fCat" placeholder="例：学校・参考資料"></label>
    <label>タグ<input id="fTags" placeholder="カンマ区切り：数学,PDF"></label>
   </div>
   <label id="urlWrap" style="display:none">URL<input id="fUrl" type="url" placeholder="https://example.com/"></label>
   <label>説明<textarea id="fDesc" placeholder="この資料についてのメモ"></textarea></label>
  </div>
  <div class="modalBtns"><button class="btn" id="cancelBtn">キャンセル</button><button class="btn primary" id="saveBtn">登録</button></div>
 </div>
</div>

<div class="preview" id="preview">
 <div class="previewbar"><span id="previewTitle"></span><button class="btn" id="closePreview">閉じる</button></div>
 <div id="previewBody" style="display:flex;flex:1"></div>
</div>

<script>
const DB_NAME='MyFileLibraryDB', STORE='items', DB_VER=1;
let db, items=[], pendingFiles=[], modalMode='file', editingId=null;

const $=id=>document.getElementById(id);
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatSize(n=0){if(n<1024)return n+' B';if(n<1024**2)return (n/1024).toFixed(1)+' KB';if(n<1024**3)return (n/1024**2).toFixed(1)+' MB';return (n/1024**3).toFixed(2)+' GB'}
function dateText(t){return new Date(t).toLocaleString('ja-JP')}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
function put(item){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(item);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function remove(id){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function getAll(){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

function updateCats(){
 const cats=[...new Set(items.map(x=>x.category).filter(Boolean))].sort();
 $('catFilter').innerHTML='<option value="">すべてのカテゴリ</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');
}
function render(){
 updateCats();
 let q=$('search').value.toLowerCase().trim(), tf=$('typeFilter').value, cf=$('catFilter').value, so=$('sort').value;
 let arr=items.filter(x=>{
   let hay=[x.title,x.name,x.description,x.category,(x.tags||[]).join(' '),x.url].join(' ').toLowerCase();
   return (!q||hay.includes(q))&&(!tf||x.kind===tf)&&(!cf||x.category===cf);
 });
 arr.sort((a,b)=>so==='name'?a.title.localeCompare(b.title,'ja'):so==='old'?a.created-b.created:so==='size'?(b.size||0)-(a.size||0):b.created-a.created);
 $('count').textContent=items.length;
 $('fileCount').textContent=items.filter(x=>x.kind==='file').length;
 $('linkCount').textContent=items.filter(x=>x.kind==='link').length;
 $('size').textContent=formatSize(items.reduce((s,x)=>s+(x.size||0),0));
 $('empty').style.display=arr.length?'none':'block';
 $('grid').innerHTML=arr.map(card).join('');
}
function iconFor(mime='',name=''){
 if(mime.startsWith('image/'))return '🖼️';
 if(mime==='application/pdf'||name.toLowerCase().endsWith('.pdf'))return '📕';
 if(mime.includes('zip')||/\.(zip|7z|rar)$/i.test(name))return '📦';
 if(mime.includes('html')||/\.(html?|htm)$/i.test(name))return '🌐';
 if(mime.includes('word')||/\.(doc|docx)$/i.test(name))return '📝';
 if(mime.includes('sheet')||/\.(xls|xlsx|csv)$/i.test(name))return '📊';
 if(mime.startsWith('video/'))return '🎬';
 if(mime.startsWith('audio/'))return '🎵';
 return '📄';
}
function card(x){
 let thumb=x.kind==='link'?'<div class="thumb">🔗</div>':x.mime?.startsWith('image/')&&x.data?`<div class="thumb"><img src="${x.data}" alt=""></div>`:`<div class="thumb">${iconFor(x.mime,x.name)}</div>`;
 let tags=(x.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('');
 let meta=x.kind==='link'?`<span class="linkIcon">WEB LINK</span> · ${esc(x.url||'')}`:`${esc(x.name||'')} · ${formatSize(x.size||0)}`;
 return `<article class="card">${thumb}<div class="cardbody"><div class="title" title="${esc(x.title)}">${esc(x.title)}</div><div class="meta">${meta}</div><div class="tags">${tags}</div><div class="desc">${esc(x.description||'')}</div><div class="actions"><button class="open" onclick="openItem('${x.id}')">${x.kind==='link'?'開く':'開く'}</button><button onclick="editItem('${x.id}')">編集</button><button class="del" onclick="deleteItem('${x.id}')">削除</button></div></div></article>`;
}

function showModal(mode, files=[], edit=null){
 modalMode=mode;pendingFiles=files;editingId=edit?.id||null;
 $('modalTitle').textContent=edit?'登録情報を編集':mode==='link'?'リンクを追加':'ファイルを追加';
 $('urlWrap').style.display=mode==='link'?'block':'none';
 $('sourceInfo').textContent=edit?'登録情報を編集しています':mode==='link'?'WebサイトのURLを登録します':files.length?files.map(f=>f.name).join(' / '):'';
 $('fTitle').value=edit?.title||((files.length===1)?files[0].name:'');
 $('fCat').value=edit?.category||'';
 $('fTags').value=(edit?.tags||[]).join(',');
 $('fUrl').value=edit?.url||'';
 $('fDesc').value=edit?.description||'';
 $('modal').classList.add('show');setTimeout(()=>$('fTitle').focus(),50);
}
function closeModal(){$('modal').classList.remove('show');pendingFiles=[];editingId=null}
$('cancelBtn').onclick=closeModal;
$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};

async function saveModal(){
 const title=$('fTitle').value.trim()||'無題';
 const category=$('fCat').value.trim();
 const tags=$('fTags').value.split(',').map(x=>x.trim()).filter(Boolean);
 const description=$('fDesc').value;
 if(editingId){
  const x=items.find(i=>i.id===editingId);if(!x)return;
  Object.assign(x,{title,category,tags,description});
  if(modalMode==='link')x.url=$('fUrl').value.trim();
  await put(x);
 }else if(modalMode==='link'){
  const url=$('fUrl').value.trim();
  if(!url){alert('URLを入力してください');return}
  try{new URL(url)}catch{alert('URLの形式を確認してください');return}
  await put({id:uid(),kind:'link',title,category,tags,description,url,created:Date.now(),size:0});
 }else{
  for(const f of pendingFiles){
   const data=await fileToDataURL(f);
   await put({id:uid(),kind:'file',title:pendingFiles.length===1?title:f.name,name:f.name,mime:f.type||'application/octet-stream',size:f.size,lastModified:f.lastModified,category,tags,description,created:Date.now(),data});
  }
 }
 items=await getAll();closeModal();render();
}
$('saveBtn').onclick=saveModal;

function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)})}
$('addFileBtn').onclick=()=>{ $('fileInput').value='';$('fileInput').click() };
$('fileInput').onchange=e=>{if(e.target.files.length)showModal('file',[...e.target.files])};
$('addLinkBtn').onclick=()=>showModal('link');

$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};
$('drop').ondragleave=()=>$('drop').classList.remove('drag');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');let fs=[...e.dataTransfer.files];if(fs.length)showModal('file',fs)};

async function openItem(id){
 const x=items.find(i=>i.id===id);if(!x)return;
 if(x.kind==='link'){window.open(x.url,'_blank','noopener');return}
 const a=document.createElement('a');
 const blob=await dataURLToBlob(x.data);
 const url=URL.createObjectURL(blob);
 if(x.mime.startsWith('image/')||x.mime==='application/pdf'||x.mime.startsWith('text/')){
   $('previewTitle').textContent=x.title;
   $('previewBody').innerHTML='';
   if(x.mime.startsWith('image/')){let im=document.createElement('img');im.src=url;$('previewBody').appendChild(im)}
   else if(x.mime==='application/pdf'){let em=document.createElement('embed');em.src=url;em.type='application/pdf';$('previewBody').appendChild(em)}
   else{let fr=document.createElement('iframe');fr.src=url;$('previewBody').appendChild(fr)}
   $('preview').classList.add('show');
   $('preview').dataset.url=url;
 }else{a.href=url;a.download=x.name||x.title;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
}
function dataURLToBlob(data){return fetch(data).then(r=>r.blob())}
$('closePreview').onclick=()=>{let u=$('preview').dataset.url;if(u)URL.revokeObjectURL(u);$('preview').classList.remove('show');$('previewBody').innerHTML=''};
async function deleteItem(id){const x=items.find(i=>i.id===id);if(!x)return;if(confirm(`「${x.title}」を削除しますか？`)){await remove(id);items=await getAll();render()}}
function editItem(id){let x=items.find(i=>i.id===id);if(x)showModal(x.kind,[],x)}

$('search').oninput=render;$('typeFilter').onchange=render;$('catFilter').onchange=render;$('sort').onchange=render;

function downloadText(filename,text,type='application/json'){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('exportBtn').onclick=()=>{
 const clean=items.map(({data,...x})=>x);
 downloadText('my-file-library.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),items:clean},null,2));
 alert('JSONを書き出しました。\\n※通常のJSONにはファイル本体は含めていません。');
};
$('importBtn').onclick=()=>{$('jsonInput').value='';$('jsonInput').click()};
$('jsonInput').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const o=JSON.parse(await f.text());if(!Array.isArray(o.items))throw Error();
  let added=0;
  for(const x of o.items){if(!x.id||!x.title)continue;let old=items.find(i=>i.id===x.id);if(old)await put({...old,...x});else await put(x);added++}
  items=await getAll();render();alert(`${added}件のデータを読み込みました。`);
 }catch{alert('JSONの形式が正しくありません。')}
};

$('backupBtn').onclick=()=>{
 const payload={version:2,type:'my-file-library-full-backup',exportedAt:new Date().toISOString(),items};
 downloadText('my-file-library-full-backup.json',JSON.stringify(payload));
};
$('backupInput').onchange=async e=>{ /* reserved */ };

document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('modal').classList.remove('show');$('preview').classList.remove('show')}});

(async()=>{await openDB();items=await getAll();render()})();
</script>
</body>
</html>
